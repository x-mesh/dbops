[package]
name = "dbops"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
# "time"/"net" are first-party needs (per-call timeouts, tcp check) — declared
# here instead of leaning on feature unification from mongodb/reqwest.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }

# Crypto backend pin: ring everywhere, aws-lc-sys nowhere.
# rustls 0.23+ defaults to the aws-lc-rs backend (aws-lc-sys, a C/asm build)
# which has a documented musl cross-compile regression. ring is pure Rust and
# cross-compiles cleanly via zig. Every TLS-capable dependency below is
# feature-gated to avoid ever requesting rustls's "aws_lc_rs" feature.
# See docs/build-spike.md for the full trace of how each crate was verified.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# default-features off + "rustls-no-provider": pulls in rustls TLS support
# (hyper-rustls/tokio-rustls) without reqwest's "rustls" feature forcing the
# aws-lc-rs backend. Requires installing a default CryptoProvider once at
# process startup (done in main.rs) since no provider ships automatically.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset"] }

# default-features off, no TLS feature selected on this crate directly.
# opensearch's own "rustls-tls" feature forwards to reqwest's "rustls"
# feature, which forces aws-lc-rs (see rustls comment above) with no ring
# alternative in this crate version. TLS is instead supplied by the shared
# reqwest instance above (opensearch and our own reqwest dependency resolve
# to the same reqwest crate instance, so its compiled-in TLS connector is
# available to opensearch's client too). Revisit if opensearch-rs ever adds a
# ring-specific TLS feature, or if mTLS client-cert support is needed (its
# ClientCertificate::Pem path is gated behind the "rustls-tls" feature).
opensearch = { version = "2.4", default-features = false }

# Default features already include "rustls-tls" -> "rustls/ring" (no aws-lc
# pull). Do not add "rustls-tls-aws-lc".
mongodb = "3.8"

tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring", "webpki-roots"] }

redis = { version = "1.3", features = ["tokio-rustls-comp", "tls-rustls-insecure"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
comfy-table = "7.2"
dialoguer = "0.12"
sysinfo = "0.39"

[profile.release]
strip = true

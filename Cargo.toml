[package]
name = "dbops"
version = "0.1.1"
edition = "2021"
description = "Dependency-free static binary that health-checks and initializes OpenSearch, MongoDB, PostgreSQL and Redis, with nagios-compatible exit codes"
license = "MIT"
repository = "https://github.com/x-mesh/dbops"
readme = "README.md"
keywords = ["cli", "sre", "monitoring", "nagios", "database"]
categories = ["command-line-utilities", "database"]
# The recorded demos are the bulk of the repository by size and none of it is
# needed to build the crate: docs/media alone is ~700 KB of GIF, and the test
# fixture only means anything next to a Docker daemon.
exclude = ["docs/media/*", "docs/tape/*", "tests/compose/*", "dist/*"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
# `dbops completion <shell>` (ROADMAP M4) -- generates a shell completion
# script from the same `Cli` clap::Command the rest of the binary runs, so
# it can never drift from the real subcommand/flag surface.
clap_complete = "4.6"
# "time"/"net" are first-party needs (per-call timeouts, tcp check) — declared
# here instead of leaning on feature unification from mongodb/reqwest.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }

# Crypto backend pin: ring everywhere, aws-lc-sys nowhere.
# rustls 0.23+ defaults to the aws-lc-rs backend (aws-lc-sys, a C/asm build)
# which has a documented musl cross-compile regression. ring is pure Rust and
# cross-compiles cleanly via zig. Every TLS-capable dependency below is
# feature-gated to avoid ever requesting rustls's "aws_lc_rs" feature.
# See docs/build-spike.md for the full trace of how each crate was verified.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Declared directly (not just pulled in by rustls above) so `dbops update`
# can SHA-256 a downloaded artifact against the release's SHA256SUMS. ring is
# already compiled into every build as rustls's crypto backend, so this costs
# nothing a `sha2`/`sha256` crate wouldn't add from scratch. Keep the version
# in step with whatever rustls resolves, so only one copy is ever built.
ring = "0.17"

# Trust roots for the update/http-check HTTPS clients (see frame/tls.rs).
# reqwest's rustls-no-provider path verifies against the system store and
# hard-fails when the image ships none (distroless, slim Debian); these give
# the clients a compiled-in Mozilla set unioned with the host's native roots
# so verification works everywhere without a `ca-certificates` package.
# Already in the graph transitively (webpki-roots via tokio-postgres-rustls),
# so declaring them direct doesn't add a build.
webpki-roots = "1.0"
rustls-native-certs = "0.8"

# default-features off + "rustls-no-provider": pulls in rustls TLS support
# (hyper-rustls/tokio-rustls) without reqwest's "rustls" feature forcing the
# aws-lc-rs backend. Requires installing a default CryptoProvider once at
# process startup (done in main.rs) since no provider ships automatically.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset"] }

# default-features off, no TLS feature selected on this crate directly.
# opensearch's own "rustls-tls" feature forwards to reqwest's "rustls"
# feature, which forces aws-lc-rs (see rustls comment above) with no ring
# alternative in this crate version. TLS is instead supplied by the shared
# reqwest instance above (opensearch and our own reqwest dependency resolve
# to the same reqwest crate instance, so its compiled-in TLS connector is
# available to opensearch's client too). Revisit if opensearch-rs ever adds a
# ring-specific TLS feature, or if mTLS client-cert support is needed (its
# ClientCertificate::Pem path is gated behind the "rustls-tls" feature).
opensearch = { version = "2.4", default-features = false }

# Default features already include "rustls-tls" -> "rustls/ring" (no aws-lc
# pull). Do not add "rustls-tls-aws-lc".
mongodb = "3.8"

tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring", "webpki-roots"] }

redis = { version = "1.3", features = ["tokio-rustls-comp", "tls-rustls-insecure"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
comfy-table = "7.2"
dialoguer = "0.12"
sysinfo = "0.39"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"

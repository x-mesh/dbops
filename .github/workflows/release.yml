name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # Pinned to match the version verified in docs/build-spike.md's musl
  # cross-build spike -- bump deliberately, not silently via "latest".
  ZIG_VERSION: "0.16.0"

jobs:
  # One job per shipped target, each a thin wrapper around
  # scripts/release-build.sh --target <triple> -- the actual build/gate/
  # package logic lives in one place (that script) instead of being
  # duplicated across matrix legs in YAML.
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl targets only: zig (cargo-zigbuild's cross linker/sysroot
      # provider) + QEMU (so Docker can run the Alpine gate's foreign-arch
      # container -- e.g. arm64 under an amd64 ubuntu-latest runner).
      # macOS builds natively, needs neither.
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}

      - if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - if: runner.os == 'Linux'
        name: install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: scripts/release-build.sh --target ${{ matrix.target }}
        run: bash scripts/release-build.sh --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: dbops-${{ matrix.target }}
          path: |
            dist/dbops-*-${{ matrix.target }}
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: merge per-target SHA256SUMS into one file
        run: |
          cd dist-artifacts
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 \
            | xargs -0 shasum -a 256 > SHA256SUMS
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/dbops-*
            dist-artifacts/SHA256SUMS
          generate_release_notes: true
